# Bozzetto: photos to a rough 3D shape for sculpting
# SPDX-License-Identifier: GPL-3.0-or-later
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bozzetto"
version = "0.2.0"
description = "Turn product photos or a short video into a rough 3D shape (OBJ) for Blender."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "bozzetto/engines/tsr/LICENSE"]
authors = [{ name = "Suman Ghosh" }]
keywords = ["photogrammetry", "3d-scanning", "visual-hull", "triposr", "blender", "obj"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Multimedia :: Graphics :: 3D Modeling",
]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "scikit-image>=0.21",
  "scipy>=1.10",
  "pillow>=10",
  "pillow-heif>=0.13",
  "platformdirs>=3",
  "PySide6>=6.5",
]

[project.optional-dependencies]
triposr = [
  "torch>=2.1",
  "transformers>=4.35",
  "omegaconf>=2.3",
  "einops>=0.7",
  "huggingface_hub>=0.20",
]
dev = ["pytest>=7"]

[project.scripts]
bozzetto-cli = "bozzetto.cli:main"

[project.gui-scripts]
bozzetto = "bozzetto.app.main_window:main"

[tool.setuptools.packages.find]
include = ["bozzetto*"]

[tool.setuptools.package-data]
"bozzetto.engines.tsr" = ["LICENSE", "UPSTREAM_COMMIT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
